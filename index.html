<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luyện nghe Pinyin: b p m f · d t n l · g k h</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <h1>Luyện nghe Pinyin</h1>
  <nav class="lesson-nav">
    <span class="lesson-link active">Bài 1: b p m f · d t n l · g k h</span>
    <a class="lesson-link" href="exam-2/index.html">Bài 2: j q x</a>
  </nav>
  <p class="subtitle">Thanh mẫu b p m f · d t n l · g k h — Vận mẫu a o e i u ü, ai ei ao ou — 30 từ</p>

  <div class="card">
    <div class="controls-row">
      <label>Tốc độ đọc</label>
      <div class="speed-line">
        <button type="button" class="speed-btn" data-speed="0.8">Chậm</button>
        <button type="button" class="speed-btn" data-speed="1">Bình thường</button>
      </div>
    </div>
  </div>

  <div id="startScreen" class="card">
    <div class="controls-row">
      <label for="studentName">Tên học sinh</label>
      <input type="text" id="studentName" class="text-input" placeholder="Nhập tên của bạn" autocomplete="name">
    </div>
    <div class="controls-row">
      <label for="studentClass">Lớp</label>
      <select id="studentClass" class="text-input" required>
        <option value="" disabled selected>-- Chọn lớp --</option>
        <option value="C1-01">C1-01</option>
        <option value="C1-02">C1-02</option>
        <option value="C1-03">C1-03</option>
      </select>
    </div>
    <button id="startBtn" class="btn-primary" disabled>Đang kiểm tra dữ liệu audio...</button>
  </div>

  <div id="quizScreen" class="card hidden">
    <div class="score-live" id="scoreLive">Điểm: 0</div>
    <div class="progress-wrap">
      <span id="progressText">Câu 1 / 100</span>
    </div>
    <div class="progress-track"><div id="progressBar"></div></div>

    <div class="hanzi-display">
      <span class="hint-mark">?</span>
      <span id="hanziChar" class="hanzi-char"></span>
    </div>
    <div id="pinyinHint" class="pinyin-hint"></div>

    <button id="playBtn" class="btn-play">🔊 Nghe từ</button>

    <div id="optionsContainer" class="options-grid"></div>

    <div id="feedback" class="feedback"></div>

    <button id="nextBtn" class="hidden">Câu tiếp theo →</button>
  </div>

  <div id="resultScreen" class="card hidden">
    <h2 style="text-align:center;">Kết quả</h2>
    <div id="resultScore"></div>
    <div id="resultBreakdown"></div>
    <button id="restartBtn" class="btn-primary" style="margin-top:16px;">Làm lại</button>
  </div>
</div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
