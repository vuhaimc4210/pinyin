<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh sách phát âm chuẩn đã tải</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <h1>Danh sách phát âm chuẩn</h1>
  <p class="subtitle">Trang xem nhanh — từ nào đã có file audio chuẩn trong thư mục <code>audio/</code>, từ nào chưa.</p>

  <div class="card">
    <div class="controls-row">
      <label for="speedRange">Tốc độ đọc</label>
      <div class="speed-line">
        <input type="range" id="speedRange" min="0.1" max="1.5" step="0.05" value="1">
        <span id="speedLabel">1.00x</span>
      </div>
    </div>
    <div id="summary" class="summary">Đang kiểm tra...</div>
  </div>

  <div class="card">
    <h2 class="section-title">Từ 1 âm tiết (SINGLES)</h2>
    <div id="singlesList" class="word-list"></div>
  </div>

  <div class="card">
    <h2 class="section-title">Từ 2 âm tiết (DOUBLES)</h2>
    <div id="doublesList" class="word-list"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="audio-preview.js"></script>
</body>
</html>
